services:
  db_test:
    # Same digest as `db` in docker-compose.yml, pinned for the same reason
    # (#1028) -- tests should run against the engine they were written
    # against. Bump both together.
    #
    # pgvector/pgvector:pg15 as of 2026-08-28
    image: pgvector/pgvector@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    environment:
      POSTGRES_DB: podlog_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock_rss:
    image: nginx:alpine
    volumes:
      - ./apps/pipeline/tests/fixtures:/usr/share/nginx/html:ro

  test:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile.worker
      args:
        INSTALL_DEV: "true"
    command: pytest tests/ -v --cov=app --cov-report=term-missing
    environment:
      DATABASE_URL: postgresql://postgres:test@db_test:5432/podlog_test
      TEST_DATABASE_URL: postgresql://postgres:test@db_test:5432/podlog_test
      PIPELINE_API_URL: http://pipeline_test:8000
      MOCK_RSS_URL: http://mock_rss/feed.xml
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      db_test:
        condition: service_healthy
      mock_rss:
        condition: service_started
      pipeline_test:
        condition: service_healthy

  pipeline_test:
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile.worker
      args:
        INSTALL_DEV: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://postgres:test@db_test:5432/podlog_test
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_BASE_URL: http://localhost:11434
    depends_on:
      db_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  web_test:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://postgres:test@db_test:5432/podlog_test
      PIPELINE_API_URL: http://pipeline_test:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      db_test:
        condition: service_healthy
      pipeline_test:
        condition: service_healthy
