[tool.poetry]
name = "podlog-pipeline"
# Deliberately pinned to the 0.0.0 sentinel (#936). The single source of
# truth for the version is the repo-root /VERSION file, read at runtime by
# app.main._read_version(). Poetry requires this key and accepts 0.0.0.
#
# It used to mirror /VERSION and had to be bumped by hand, which is exactly
# how apps/web/package.json drifted five minor versions behind without
# anything noticing. Verified before changing: nothing reads this value at
# runtime -- _read_version() reads the file, not the package metadata.
version = "0.0.0"
description = "Podlog ingestion pipeline — RSS fetch, Whisper transcription, pyannote diarization"
authors = []
license = "O'Saasy"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# Web / API
#
# fastapi was held on the 0.111 line for a long time (#770, #906). That was
# reversed once the pip-audit gate added in #915 ran for the first time and
# showed starlette 0.37.2 carrying 7 advisories, five of which are only
# fixed in the 1.x line. starlette sits directly in the request path, so
# "no benefit today" stopped being true.
#
# Note fastapi declares `starlette>=0.46.0` with no upper bound, so the
# fastapi constraint is what governs which starlette gets resolved -- the
# two cannot be moved independently.
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.48.0"}
httpx = "^0.28.0"

# Config
pydantic = "^2.13.0"
pydantic-settings = "^2.2.0"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.4.0"

# RSS parsing
feedparser = "^6.0.11"

# Audio processing
ffmpeg-python = "^0.2.0"

# python-multipart parses UploadFile bodies for POST /api/episodes/upload, so
# it sits on an untrusted-input path. 0.0.22 carried five advisories
# (PYSEC-2026-3036/3037/3038/3039/3040), fixed across 0.0.26-0.0.31 (#930).
#
# Note the range form: a caret on a 0.0.x resolves to <0.0.23, i.e. an exact
# pin that `poetry update` cannot move. `>=0.0.31,<0.1` keeps patch fixes
# flowing without needing a manifest edit each time.
python-multipart = ">=0.0.31,<0.1"

# Token counting for meta-analysis dashboard (#521)
tiktoken = "^0.13.0"

# ML group (#915). Optional and not installed by default -- the worker needs
# all of it, the control plane needs sentence-transformers for /api/embed.
# Since 2026-08-09 the CI dependency audit covers this group by exporting the
# lock, which is what made its advisories visible for the first time.
#
# ---------------------------------------------------------------------------
# CVE triage, 2026-08-19 (#951). The audit reports 14 findings here. NONE can
# be resolved by a version bump today, and the reason is a single package.
#
# whisperx 3.8.6 (the latest release; 3.8.7rc1 is identical here) declares:
#     torch~=2.8.0            -> forbids torch 2.9.0 / 2.10.0
#     huggingface-hub<1.0.0   -> forbids hub 1.x
#                             -> forbids transformers 5.x (it needs hub>=1.3.0)
#
# So whisperx blocks every advisory that has an upstream fix. Note our own
# `huggingface-hub = ">=0.28.1,<1.0"` pin below is NOT the binding constraint
# -- whisperx enforces the same bound independently, so relaxing ours would
# change nothing.
#
# Per-finding status:
#
#   NOT APPLICABLE (3) -- affected versions are 2.6.0 only; we run 2.8.0.
#     torch PYSEC-2025-194   last_affected "2.6.0-NA", an unparseable version
#     torch CVE-2025-2999    range is a git commit pip-audit cannot resolve
#     torch CVE-2025-3001    same
#   These are pip-audit matching conservatively, not real exposure.
#
#   REAL, BLOCKED BY whisperx (8)
#     torch        PYSEC-2025-203/204/206   fixed in 2.9.0
#     torch        PYSEC-2026-2286          fixed in 2.10.0
#     transformers PYSEC-2025-217           fixed in 5.0.0
#     transformers PYSEC-2026-2288          fixed in 5.0.0
#     transformers PYSEC-2026-2289          fixed in 5.3.0
#     transformers PYSEC-2026-2290          fixed after 5.2.0
#
#   NO FIX IN ANY RELEASE (2)
#     torch     PYSEC-2026-139   affects everything <=2.10.0; local-only attack
#     lightning PYSEC-2026-3624  fixed only in an unreleased commit (d710d68).
#                                The advisory's "fix version 2022.6.15" is bad
#                                metadata, not a real target -- do not act on it.
#
# Reachability. Every real finding requires loading an attacker-controlled
# model or checkpoint: torch's weights_only unpickler, lightning's
# load_from_checkpoint, transformers' Trainer, X-CLIP conversion, LightGlue
# loading, or a crafted config.json. Two are unreachable on independent
# grounds -- Podlog never trains (Trainer is unused, and that advisory needs
# torch<2.6 anyway), and X-CLIP/LightGlue models are never loaded.
#
# The rest reduce to one question: can anything other than the operator choose
# which model gets loaded? Until #951 the answer was yes -- `embedding_model`
# accepted an arbitrary string and reached SentenceTransformer(), which
# resolves it as a Hub repo id. That is now allowlisted in
# services/notification_settings.py, which is the one part of this that WAS
# fixable. See #952 for the broader unauthenticated-API question.
#
# Re-check when whisperx relaxes either pin. That is the trigger; nothing
# else here moves until then.
# ---------------------------------------------------------------------------
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# WhisperX (CTranslate2 backend + wav2vec2 alignment)
whisperx = "^3.8.0"
torch = "^2.2.0"
# torchaudio is a transitive requirement of whisperx/pyannote-audio and is
# never imported directly (#915). Declared explicitly so the version is
# pinned by us rather than resolved incidentally — same reasoning as the
# soundfile pin above.
torchaudio = "^2.2.0"
# Audio I/O backend for reading the pre-ffmpeg'd WAV into pyannote.
# torchaudio 2.8 registers no default backend, so without soundfile we get
# "Couldn't find appropriate backend ... format None".
soundfile = "^0.12.1"

# pyannote diarization (>=4.0 required by whisperx)
pyannote-audio = ">=3.1.0"

# Imported directly by app/services/pyannote.py for typed exception classes.
# Pinned to match the range already required transitively by whisperx (>=0.28.1)
# and transformers (<1.0); declaring it here protects us from a future upstream
# change that drops the transitive dep. See issue #657.
huggingface-hub = ">=0.28.1,<1.0"

# spaCy NER for host/guest inference (PRD-04)
spacy = "^3.7"

# Sentence embeddings for semantic search (Level 3)
sentence-transformers = ">=2.2.0"
numpy = ">=1.26,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring full Docker stack",
]
