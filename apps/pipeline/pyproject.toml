[tool.poetry]
name = "podlog-pipeline"
# Kept in sync with the repo-root VERSION file. The runtime version is read
# from that file by app.main._read_version(); this is packaging metadata only.
version = "0.5.4"
description = "Podlog ingestion pipeline — RSS fetch, Whisper transcription, pyannote diarization"
authors = []
license = "O'Saasy"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# Web / API
#
# fastapi is deliberately held on the 0.111 line (#906, previously #770).
# A caret on a 0.x pins >=0.111.0,<0.112.0, so this is effectively a pin —
# `poetry update` cannot move it, only editing this constraint can.
#
# Why not bump: the work is not fastapi, it is starlette 0.37 -> 1.6, a real
# major with breaking changes in middleware and background tasks. We are not
# hitting any bug fixed upstream, so the bump is cost without benefit today.
#
# When to revisit: if a CVE lands in fastapi/starlette (they sit directly in
# the request path), or when something else forces the upgrade. Adding
# pip-audit to CI (#915) is the higher-value move — it makes that risk
# visible, which is the actual gap here rather than the version number.
#
# Audits keep re-filing this; please update this note rather than deleting it.
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.48.0"}
httpx = "^0.28.0"

# Config
pydantic = "^2.13.0"
pydantic-settings = "^2.2.0"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.4.0"

# RSS parsing
feedparser = "^6.0.11"

# Audio processing
ffmpeg-python = "^0.2.0"

# python-multipart parses UploadFile bodies for POST /api/episodes/upload, so
# it sits on an untrusted-input path. 0.0.22 carried five advisories
# (PYSEC-2026-3036/3037/3038/3039/3040), fixed across 0.0.26-0.0.31 (#930).
#
# Note the range form: a caret on a 0.0.x resolves to <0.0.23, i.e. an exact
# pin that `poetry update` cannot move. `>=0.0.31,<0.1` keeps patch fixes
# flowing without needing a manifest edit each time.
python-multipart = ">=0.0.31,<0.1"

# Token counting for meta-analysis dashboard (#521)
tiktoken = "^0.13.0"

# ML group (#915). Optional and not installed by default -- only the worker
# needs it. As of 2026-08-09 the CI dependency audit covers this group by
# exporting the lock rather than installing it, and it is the largest CVE
# surface in the project: torch 2.8.0 carries 8 advisories, transformers
# 4.57.6 carries 5, lightning 2.6.5 carries 1. Upgrading is not a version
# bump -- torch 2.9/2.10 moves whisperx and pyannote-audio with it, so it
# needs its own scoped piece of work against a real GPU/CPU run.
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# WhisperX (CTranslate2 backend + wav2vec2 alignment)
whisperx = "^3.8.0"
torch = "^2.2.0"
# torchaudio is a transitive requirement of whisperx/pyannote-audio and is
# never imported directly (#915). Declared explicitly so the version is
# pinned by us rather than resolved incidentally — same reasoning as the
# soundfile pin above.
torchaudio = "^2.2.0"
# Audio I/O backend for reading the pre-ffmpeg'd WAV into pyannote.
# torchaudio 2.8 registers no default backend, so without soundfile we get
# "Couldn't find appropriate backend ... format None".
soundfile = "^0.12.1"

# pyannote diarization (>=4.0 required by whisperx)
pyannote-audio = ">=3.1.0"

# Imported directly by app/services/pyannote.py for typed exception classes.
# Pinned to match the range already required transitively by whisperx (>=0.28.1)
# and transformers (<1.0); declaring it here protects us from a future upstream
# change that drops the transitive dep. See issue #657.
huggingface-hub = ">=0.28.1,<1.0"

# spaCy NER for host/guest inference (PRD-04)
spacy = "^3.7"

# Sentence embeddings for semantic search (Level 3)
sentence-transformers = ">=2.2.0"
numpy = ">=1.26,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring full Docker stack",
]
