name: CI Full Unit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-full-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-unit-full:
    name: Pipeline Unit Full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install pipeline dependencies (no ML extras)
        run: |
          poetry config virtualenvs.create false
          poetry install --with dev --without ml --no-interaction --no-ansi --no-root

      - name: Run all pipeline unit tests with coverage
        run: pytest tests/unit -q --cov=app --cov-fail-under=82

  pipeline-dep-audit:
    # Issue #915: the Python side had no CVE gate comparable to `npm audit`,
    # so a vulnerability in fastapi/starlette — which sit directly in the
    # request path — would have been invisible. See also #906, where the
    # fastapi pin is held deliberately; this job is what makes that risk
    # observable rather than assumed.
    #
    # Advisory-only for now (continue-on-error): findings show up in the
    # job log without blocking unrelated PRs on a fresh upstream CVE.
    # Flip `continue-on-error` to false to make it a hard gate.
    #
    # EXPECTED TO BE RED as of 2026-08-19 (#951). The non-ML dependencies
    # audit clean since #906; every remaining finding is in the optional ml
    # group and none can be fixed today -- whisperx pins torch~=2.8.0 and
    # huggingface-hub<1.0.0, which blocks every advisory that has an
    # upstream fix. The per-advisory triage, including which findings do not
    # apply at all, is recorded in apps/pipeline/pyproject.toml above the ml
    # group. Read that before investigating a red run here.
    #
    # The count is the signal: 14 findings across torch, transformers and
    # lightning. If that number CHANGES, something new has landed and is
    # worth looking at. Upstream trigger to watch: whisperX PR #1417 or a
    # whisperx 3.9 release relaxing either pin.
    name: Pipeline Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry, export plugin and pip-audit
        run: pip install poetry poetry-plugin-export pip-audit

      # Export rather than install. The first version of this job installed
      # `--without ml` and audited the environment, which left the ML group
      # (torch, transformers, lightning, whisperx, pyannote-audio, spacy,
      # sentence-transformers) completely unaudited — and that turned out to
      # be the largest CVE surface in the project (#915). Exporting the lock
      # covers every pinned dependency, including ML, and needs no install at
      # all, so it is both more complete and considerably faster.
      #
      # Both optional groups are named (#977). `embed` holds what the control
      # plane installs; naming it explicitly keeps the audit complete even if
      # a package later exists only there. Missing a group here is precisely
      # the failure #915 was about.
      - name: Export the full locked dependency set (including ML)
        run: poetry export --with ml,embed -f requirements.txt --without-hashes -o /tmp/requirements.txt

      # Make the export auditable against PyPI advisories (#977).
      #
      # Two things in a poetry export defeat pip-audit once torch comes from
      # the PyTorch CPU index:
      #
      #  1. Line 1 is `--extra-index-url https://download.pytorch.org/whl/cpu`.
      #     pip-audit honours it, and under PEP 440 the specifier `==2.8.0`
      #     also matches `2.8.0+cpu`, so it re-resolves to the CPU wheel.
      #  2. The pins themselves read `torch==2.8.0+cpu`.
      #
      # Either way pip-audit ends up holding a version PyPI has no advisory
      # data for, prints
      #     Dependency not found on PyPI and could not be audited: torch (2.8.0+cpu)
      # and moves on. torch, torchaudio and torchvision then stop being
      # audited: the finding count silently fell from 14 in 3 packages to 6
      # in 2, which reads like an improvement. It was not -- the advisories
      # still apply. Same class of gap as #915, reached from the other side.
      #
      # A local version identifier denotes a build variant, not different
      # source: 2.8.0+cpu is the 2.8.0 codebase compiled without CUDA
      # kernels, so PyPI's advisories for 2.8.0 apply unchanged.
      - name: Make the export auditable against PyPI advisories
        run: |
          echo "--- index directives and local-version pins, before ---"
          grep -nE '^--(extra-)?index-url|^[A-Za-z0-9._-]+==[^ ;]*\+' /tmp/requirements.txt || echo "(none)"
          sed -i -E '/^--(extra-)?index-url/d' /tmp/requirements.txt
          sed -i -E 's/^([A-Za-z0-9._-]+==[0-9][^ ;+]*)\+[A-Za-z0-9.]+/\1/' /tmp/requirements.txt
          echo "--- torch pins, after ---"
          grep -nE '^torch(audio|vision)?==' /tmp/requirements.txt || echo "(no torch pins -- unexpected)"

      # Fail loudly if either rewrite ever stops matching. Reverting to a
      # silently unaudited torch is the failure mode this exists to prevent.
      - name: Verify nothing in the export can be skipped by pip-audit
        run: |
          bad=$(grep -nE '^--(extra-)?index-url|^[A-Za-z0-9._-]+==[^ ;]*\+' /tmp/requirements.txt || true)
          if [ -n "$bad" ]; then
            echo "::error::Export still contains directives or pins that make pip-audit skip packages:"
            echo "$bad"
            exit 1
          fi

      # --no-deps: the export is already fully pinned, so audit exactly those
      # versions rather than re-resolving.
      - name: Audit locked dependencies for known CVEs
        run: pip-audit -r /tmp/requirements.txt --no-deps --progress-spinner off

  web-unit-full:
    name: Web Unit Full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run all web unit tests with coverage
        run: npm test -- --runInBand --coverage --testPathPatterns=tests/unit
