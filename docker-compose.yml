services:
# Phase 2 of #937: an `image:` alongside each `build:`, so one compose file
# serves both paths instead of a release copy that silently drifts from the
# real one.
#
#   make build && make up   -- builds from source, tags the result with the
#                              name below. The development path, unchanged.
#   make up-release         -- pulls the published image and starts without
#                              building. The user path.
#
# PODLOG_VERSION selects which published image: `stable` (the newest release),
# `edge` (current main), or an exact `X.Y.Z`. It has no effect when you build
# locally -- the build just gets tagged with whatever it resolves to.
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: podlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bound to loopback (#952). Postgres holds everything and was reachable
    # from the whole LAN; password auth is the only thing that stood between
    # the network and the data. Host tooling is unaffected -- `make shell-db`
    # goes through `docker compose exec`, and every container reaches the DB
    # as `db:5432` over the compose network, not via this mapping.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    image: ghcr.io/brlauuu/podlog-pipeline:${PODLOG_VERSION:-stable}
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile.control
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/podlog
      # Mirrored from the backup service (#630) so /api/backups (#646)
      # can report retention to the Settings UI.
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
    # Bound to loopback (#952, #960). Changing this to 0.0.0.0 puts an
    # UNAUTHENTICATED write API on your network -- see the Security model
    # section in docs/guide/01-installation.md before you do.
    #
    # The pipeline API has no authentication, and
    # every write endpoint -- settings (which holds the Fireworks and pyannote
    # keys), backfill, retry, upload, feed CRUD -- was open to anything that
    # could route here. Removing the mapping entirely was considered and
    # rejected: scripts/healthcheck.py, `make backfill` and two user guides all
    # call http://localhost:8000. Loopback keeps those working while dropping
    # LAN reachability. The web container uses http://pipeline:8000.
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio_data:/data/audio
      - transcript_data:/data/transcripts
      # Read-write mount: /api/backups (#646) lists available backups, and
      # the DELETE endpoints under /api/backups/{db,audio}/... (#687) remove
      # individual dumps and snapshots. Those endpoints validate tier and
      # filename/date with strict regexes and guard against path traversal —
      # they're the only writes the pipeline ever does under /backups.
      - ./backups:/backups
      # app.main._read_version() reads /app/VERSION at runtime. Baking it via
      # `COPY . .` only works when apps/pipeline/VERSION exists at build time
      # (which only `make build` stages), so a bare `docker compose build`
      # would otherwise stamp the 0.0.0 fallback. Mounting the live file makes
      # the reported version correct regardless of how the image was built —
      # mirrors web's ./VERSION:/version:ro mount.
      - ./VERSION:/app/VERSION:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Returns 200 only after migrations complete and app is ready
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: ghcr.io/brlauuu/podlog-worker:${PODLOG_VERSION:-stable}
    build:
      context: ./apps/pipeline
      dockerfile: Dockerfile.worker
    command: >
      sh -c "python -m app.tasks.prewarm && python -m app.worker"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/podlog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio_data:/data/audio
      - transcript_data:/data/transcripts
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      pipeline:
        condition: service_healthy  # Ensures migrations are done before worker writes to DB

  ollama:
    image: ollama/ollama:latest
    # Bound to loopback (#952). Ollama's API is unauthenticated and will run
    # arbitrary prompts against local models for anyone who can reach it.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 20g

  web:
    image: ghcr.io/brlauuu/podlog-web:${PODLOG_VERSION:-stable}
    build:
      # Context is the repo root so the Dockerfile can read the VERSION file
      # directly (a root .dockerignore keeps the context small).
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # APP_VERSION is optional. `make build` and CI pass it explicitly;
        # when omitted (e.g. a bare `docker compose build web`), the Dockerfile
        # falls back to the repo-root VERSION file, so the baked-in version is
        # never the 0.0.0 sentinel that made the footer cry "rebuild available".
        APP_VERSION: ${APP_VERSION:-}
    # Deliberately NOT loopback-bound (#952), unlike db/pipeline/ollama above.
    # This is the user-facing UI and being able to open Podlog from a phone or
    # another machine on the LAN is a reasonable thing to want.
    #
    # Know what that means before leaving it: this is NOT a read-only viewer.
    # There is no login, and the web app forwards writes to the pipeline API on
    # your behalf, so anyone who can open port 3000 -- every device on the
    # network, guests included -- has full control of Podlog: add and delete
    # feeds, delete episodes and transcripts, delete backups, upload audio,
    # trigger re-processing, change every setting. API keys are the one
    # exception; they are masked when read back.
    #
    # So the trust boundary is the network, not the host. See "Security model"
    # in docs/guide/01-installation.md (#960, #988), which is the source this
    # summarises. Change this to 127.0.0.1:3000:3000 if you only ever browse
    # from this host.
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/podlog
      PIPELINE_API_URL: http://pipeline:8000
      # Bounds the query-embedding call and the post-failure cooldown (#928).
      # Empty means "use the built-in defaults" (2000ms / 30000ms).
      EMBED_TIMEOUT_MS: ${EMBED_TIMEOUT_MS:-}
      EMBED_COOLDOWN_MS: ${EMBED_COOLDOWN_MS:-}
    volumes:
      - audio_data:/data/audio:ro
      # #990: the docs Ask bubble retrieves from the guide, the reference
      # docs and the PRDs at request time, so the whole of docs/ and prds/
      # is mounted rather than the two files the pages needed before.
      # Read-only: nothing in the web container ever writes here.
      - ./docs:/docs:ro
      - ./prds:/prds:ro
      # CHANGELOG.md is mounted at the repo-root path it actually has, not
      # inside /docs. It used to be mapped to /docs/CHANGELOG.md, which a
      # read-only ./docs mount cannot host -- runc cannot create a
      # mountpoint inside a :ro bind. Reading it from the root also makes
      # dev match the container, where the About page previously found no
      # changelog at all because <repo>/docs/CHANGELOG.md does not exist.
      - ./CHANGELOG.md:/CHANGELOG.md:ro
      # /api/version reads this at request time and compares against
      # NEXT_PUBLIC_APP_VERSION (baked at build time) so the footer can
      # signal "your running image is stale, rebuild it" when VERSION
      # bumps between rebuilds.
      - ./VERSION:/version:ro
    depends_on:
      db:
        condition: service_healthy
      pipeline:
        condition: service_healthy  # Waits for migrations -- prevents schema-not-found errors

  # Issue #630: daily backup of the Podlog DB + audio archive.
  # Always-on. Set BACKUP_RETENTION_DAILY/WEEKLY/MONTHLY=0 to disable
  # individual buckets; set all three to 0 to opt out entirely.
  # Backups land on the host at ./backups/ (gitignored).
  backup:
    image: ghcr.io/brlauuu/podlog-backup:${PODLOG_VERSION:-stable}
    build: ./apps/backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: podlog
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
    volumes:
      # Not :ro — restore-audio.sh needs to write back. The backup loop is
      # read-only by design; the rsync command in backup.sh never targets
      # /source/.
      - audio_data:/source/audio
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Issue #607: optional Jupyter-based DB exploration environment.
  # Opt-in via Compose profile so a default `docker compose up` doesn't pull
  # the image or run the service. Start with `make explore` (or
  # `docker compose --profile explore up explore`).
  explore:
    build: ./apps/explore
    profiles: [explore]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/podlog
    ports:
      # Localhost-only binding — the Jupyter token is the only thing between
      # the world and your DB, so don't expose this off the box. If a user
      # needs remote access they should put it behind a reverse proxy.
      - "127.0.0.1:8888:8888"
    volumes:
      - ./notebooks:/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  audio_data:
  transcript_data:
  model_cache:
  ollama_data:
