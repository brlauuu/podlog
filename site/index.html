<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podlog</title>
<meta name="description" content="Your self-hosted transcription database. Podlog downloads the episodes, transcribes them, names the speakers, and gives you search and a question box over all of it.">
<link rel="icon" href="assets/podlog-favicon.png">

<meta property="og:site_name" content="Podlog">
<meta property="og:title" content="Podlog">
<meta property="og:description" content="Your self-hosted transcription database.">
<meta property="og:url" content="https://brlauuu.github.io/podlog/">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
/* Palette lifted verbatim from apps/web/src/app/globals.css so the page and
   the app it advertises are the same colours. Light first, then the two dark
   forms: the OS preference, and an explicit data-theme override. */
:root{
  --background:hsl(0 0% 100%);
  --foreground:hsl(0 0% 20%);
  --muted:hsl(0 0% 96%);
  --muted-foreground:hsl(0 0% 45%);
  --border:hsl(0 0% 90%);
  --accent:hsl(0 0% 96%);
  --link:hsl(210 79% 56%);
  --banner-bg:hsl(210 79% 96%);
  --banner-border:hsl(210 79% 82%);
  --radius:0.5rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --background:hsl(0 0% 10%);
    --foreground:hsl(0 0% 83%);
    --muted:hsl(0 0% 17%);
    --muted-foreground:hsl(0 0% 60%);
    --border:hsl(0 0% 17%);
    --accent:hsl(0 0% 17%);
    --link:hsl(210 79% 65%);
    --banner-bg:hsl(210 40% 16%);
    --banner-border:hsl(210 45% 28%);
  }
}
:root[data-theme="dark"]{
  --background:hsl(0 0% 10%);
  --foreground:hsl(0 0% 83%);
  --muted:hsl(0 0% 17%);
  --muted-foreground:hsl(0 0% 60%);
  --border:hsl(0 0% 17%);
  --accent:hsl(0 0% 17%);
  --link:hsl(210 79% 65%);
  --banner-bg:hsl(210 40% 16%);
  --banner-border:hsl(210 45% 28%);
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--background);
  color:var(--foreground);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:4px}

/* Release banner. Hidden in the markup and revealed by script only when the
   baked release date is inside the window -- see the note on the script at
   the bottom of the page for why that direction and not the other. */
.banner{
  display:block;
  background:var(--banner-bg);
  border-bottom:1px solid var(--banner-border);
  color:var(--foreground);
  text-align:center;
  padding:11px 20px;
  font-size:14.5px;
  text-decoration:none;
}
.banner:hover{text-decoration:none;filter:brightness(0.98)}
.banner b{font-weight:600}
.banner .arrow{color:var(--muted-foreground);margin-left:6px}
[hidden]{display:none !important}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:32px;
  width:100%;
  max-width:840px;
  margin:0 auto;
  padding:64px 24px 48px;
  text-align:center;
}
@media (max-width:600px){main{padding:40px 20px 32px;gap:26px}}

.logo{width:280px;height:auto}
@media (min-width:640px){.logo{width:420px}}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo-light{display:none}
  :root:not([data-theme="light"]) .logo-dark{display:block}
}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}

h1{
  margin:-14px 0 0;
  font-size:19px;
  font-weight:400;
  color:var(--muted-foreground);
}

/* Icon buttons. The label lives in aria-label and title, not on screen. */
.actions{display:flex;gap:12px;align-items:stretch}
.btn{
  display:inline-flex;
  align-items:center;
  gap:9px;
  height:46px;
  padding:0 16px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--background);
  color:var(--foreground);
  transition:background-color .15s ease,border-color .15s ease;
}
.btn:hover{background:var(--accent);text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.counts{display:flex;align-items:center;gap:12px;padding-left:11px;border-left:1px solid var(--border);height:22px}
.counts:has(.num:empty){display:none}
.count{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.count svg{width:14px;height:14px}

/* Video slot. A real recording replaces the whole figure. */
.video{
  margin:0;
  width:100%;
  aspect-ratio:16/9;
  border:1px dashed var(--border);
  border-radius:var(--radius);
  background:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  color:var(--muted-foreground);
  font-size:14.5px;
}
.video svg{width:34px;height:34px;opacity:.5}

footer{
  padding:28px 24px 40px;
  text-align:center;
  color:var(--muted-foreground);
  font-size:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
footer .ver{font-size:13px}
</style>
</head>

<body>

<a class="banner" id="release-banner" href="https://github.com/brlauuu/podlog/releases/tag/v__VERSION__" data-released="__RELEASED__" hidden>
  Podlog <b>__VERSION__</b> has been released<span class="arrow">&rarr;</span>
</a>

<main>
  <img class="logo logo-light" src="assets/podlog-logo-light-theme.svg" alt="Podlog" width="970" height="320">
  <img class="logo logo-dark" src="assets/podlog-logo-dark-theme.svg" alt="Podlog" width="970" height="320">

  <h1>Your self-hosted transcription database.</h1>

  <div class="actions">
    <a class="btn" href="https://github.com/brlauuu/podlog/blob/main/docs/guide/01-installation.md" aria-label="Install guide" title="Install guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
    </a>

    <a class="btn" href="https://github.com/brlauuu/podlog" aria-label="Source on GitHub" title="Source on GitHub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      <span class="counts">
        <span class="count" title="Stars">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
          <span class="num" id="stars">__STARS__</span>
        </span>
        <span class="count" title="Forks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg>
          <span class="num" id="forks">__FORKS__</span>
        </span>
      </span>
    </a>
  </div>

  <figure class="video">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    <figcaption>A walkthrough video is on its way.</figcaption>
  </figure>
</main>

<footer>
  <span>Brought to you by <a href="https://brlauuu.github.io">brlauuu</a></span>
  <span class="ver">v__VERSION__ &middot; <a href="https://github.com/brlauuu/podlog/blob/main/CHANGELOG.md">changelog</a></span>
</footer>

<script>
// Two small jobs, both of which degrade to something correct when they fail.
(function () {
  // 1. The release banner. Its age cannot be decided at build time: the page
  //    is rebuilt only on a release or a site edit, so a banner baked as
  //    "shown" would stay shown for as long as nobody touched the repo. The
  //    date is baked, the comparison happens here. It starts hidden on
  //    purpose -- with scripting off you get no banner, which is a far
  //    smaller error than a page insisting forever that a release is new.
  var WINDOW_DAYS = 30;
  var banner = document.getElementById('release-banner');
  var released = banner && banner.dataset.released;
  if (released) {
    var age = Date.now() - Date.parse(released);
    if (age >= 0 && age < WINDOW_DAYS * 864e5) banner.hidden = false;
  }

  // 2. Star and fork counts. The workflow bakes the numbers as they were at
  //    deploy; this refreshes them. Unauthenticated api.github.com allows 60
  //    requests an hour per IP, so a failure here is expected sometimes and
  //    simply leaves the baked numbers in place.
  fetch('https://api.github.com/repos/brlauuu/podlog')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d) {
      if (typeof d.stargazers_count === 'number') {
        document.getElementById('stars').textContent = d.stargazers_count;
      }
      if (typeof d.forks_count === 'number') {
        document.getElementById('forks').textContent = d.forks_count;
      }
    })
    .catch(function () {});
})();
</script>

</body>
</html>
